<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <title>AI Desktop Kanojo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main aria-label="デスクトップの仮キャラクター">
      <div
        id="character"
        role="button"
        tabindex="0"
        aria-label="テスト用画像（小春の正式素材ではありません）。ドラッグで移動、右クリックでメニュー"
        title="ドラッグで移動・右クリックでメニュー"
      ></div>
      <p
        id="greeting"
        class="greeting"
        role="status"
        aria-live="polite"
        hidden
      ></p>
      <p id="status" class="visually-hidden" role="status">初期化中</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
